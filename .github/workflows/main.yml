# Nora fetch split out to a self-hosted runner labelled "l1";
# everything else stays on GitHub-hosted ubuntu-24.04.
#
# Setup once on the l1 machine:
#   ./config.sh --url https://github.com/<owner>/<repo> --token <token> --labels l1
#   # requires: python3, curl, tar
# The curl-impersonate binary is cached in ~/.nora-ci and reused across runs.

name: Decrypt and Generate Configs

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: read

jobs:
  # --------------------------------------------------------------------- #
  # 1) Runs ONLY on the self-hosted worker whose IP the API accepts
  # --------------------------------------------------------------------- #
  nora:
    name: Nora fetch (self-hosted l1)
    runs-on: [self-hosted, l1]
    timeout-minutes: 12
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Ensure curl-impersonate
        run: |
          CI_DIR="$HOME/.nora-ci"
          if [ ! -x "$CI_DIR/curl-impersonate-chrome" ]; then
            mkdir -p "$CI_DIR"
            curl -sSL -o "$CI_DIR/ci.tar.gz" \
              https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
            tar xzf "$CI_DIR/ci.tar.gz" -C "$CI_DIR"
            rm -f "$CI_DIR/ci.tar.gz"
            chmod +x "$CI_DIR"/curl_* "$CI_DIR"/curl-impersonate-*
          fi
          "$CI_DIR/curl-impersonate-chrome" --version | head -1
          echo "CI_DIR=$CI_DIR" >> "$GITHUB_ENV"
          python3 --version

      - name: Diagnose Nora access
        continue-on-error: true
        env:
          NORA_UUID: ${{ secrets.NORA_UUID }}
          NORA_UA: ${{ secrets.NORA_UA }}
        run: |
          cd no
          UUID="$(printf '%s' "$NORA_UUID" | tr -d '[:space:]')"
          UA="$(printf '%s' "$NORA_UA" | tr -d '\r\n')"
          python3 no_conf.py --diagnose \
            --impersonate "$CI_DIR/curl-impersonate-chrome" \
            --uuid "$UUID" --user-agent "$UA"

      - name: Run no script
        env:
          NORA_UUID: ${{ secrets.NORA_UUID }}
          NORA_UA: ${{ secrets.NORA_UA }}
          NORA_PROXY: ${{ secrets.NORA_PROXY }}
        run: |
          cd no
          UUID="$(printf '%s' "$NORA_UUID" | tr -d '[:space:]')"
          UA="$(printf '%s' "$NORA_UA" | tr -d '\r\n')"
          python3 no_conf.py \
            --impersonate "$CI_DIR/curl-impersonate-chrome" \
            --uuid "$UUID" --user-agent "$UA" \
            ${NORA_PROXY:+--proxy "$NORA_PROXY"} \
            --ech --ech-count 6 --ech-attempts 6 --ech-delay 8 --max-wait 45 \
            --xrayjson --inject-credential --out configs.json --allow-empty

      - name: Upload Nora configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-configs
          path: no/configs.json
          if-no-files-found: warn

  # --------------------------------------------------------------------- #
  # 2) Everything else, on GitHub-hosted runners
  # --------------------------------------------------------------------- #
  build-and-commit:
    name: Merge and commit
    needs: nora
    # run even if the self-hosted job failed/timed out, so the other generators
    # still update; the missing artifact is replaced with an empty list below
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python3 -m pip install --user --break-system-packages requests cryptography python-dotenv pycountry

      - name: Download Nora configs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nora-configs
          path: no

      - name: Ensure no/configs.json exists
        run: |
          mkdir -p no
          if [ ! -f no/configs.json ]; then echo '[]' > no/configs.json; fi
          head -c 120 no/configs.json; echo

      # ---- unchanged steps from here on ---- #
      - name: Download and Set Up Xray-core
        run: |
          if [ "${{ runner.arch }}" == "X64" ]; then
            XRAY_ARCH="linux-64"
          elif [ "${{ runner.arch }}" == "ARM64" ]; then
            XRAY_ARCH="linux-arm64-v8a"
          else
            echo "Unsupported architecture: ${{ runner.arch }}"
            exit 1
          fi

          XRAY_VERSION="v25.7.26"
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-${XRAY_ARCH}.zip"

          echo "Downloading Xray from $XRAY_URL"
          curl -L -o xray.zip "$XRAY_URL"
          unzip -o xray.zip xray
          chmod +x xray
          echo "$(pwd)" >> $GITHUB_PATH
          ./xray version

      - name: Download and Set Up xray-checker
        run: |
          if [ "${{ runner.arch }}" == "X64" ]; then
            CHECKER_URL="https://github.com/kutovoys/xray-checker/releases/download/v0.4.3/xray-checker-v0.4.3-linux-amd64.tar.gz"
          elif [ "${{ runner.arch }}" == "ARM64" ]; then
            CHECKER_URL="https://github.com/kutovoys/xray-checker/releases/download/v0.4.3/xray-checker-v0.4.3-linux-arm64.tar.gz"
          else
            echo "Unsupported architecture: ${{ runner.arch }}"
            exit 1
          fi

          echo "Downloading xray-checker from $CHECKER_URL"
          curl -L -o checker.tar.gz "$CHECKER_URL"
          tar -xzvf checker.tar.gz
          chmod +x xray-checker
          echo "$(pwd)" >> $GITHUB_PATH
          ./xray-checker --help || true

      - name: Create begz directory
        run: mkdir -p begz

      - name: List files in workspace
        run: ls -R

      - name: Create .env file for decryption
        run: |
          echo "API_URL=${{ secrets.API_URL }}" > begz/.env
          echo "DECRYPT_KEY=${{ secrets.DECRYPT_KEY }}" >> begz/.env

      - name: Run decryption script
        run: |
          cd begz
          python3 decrypt_script.py

      - name: Run generator script
        env:
          URL: ${{ secrets.URL }}
        run: |
          cd nb
          python3 configs_gen.py

      - name: Create .env file for yebe
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > yebe/.env
          echo "GGITHUB_API_URL=${{ secrets.GGITHUB_API_URL }}" >> yebe/.env

      - name: Create .env file for freesub
        run: |
          echo "TARGET_URL=${{ secrets.TARGET_URL }}" > freesub/.env

      - name: Run freesub script
        run: |
          cd freesub
          python3 configs_gen.py

      - name: Run ala script
        run: |
          cd ala
          python3 configs_gen.py

      - name: Run kid script
        run: |
          cd kid
          python3 kid_config.py --xrayjson --exclude hysteria,hysteria2 --out configs.json
          rm kidi_state.json

      - name: Run hand script
        run: |
          cd hand
          python3 configs_gen.py

      - name: Merge all configs
        run: python3 merge_configs.py

      - name: Commit and push updated configs
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated update of config files - $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push --force origin HEAD:main
          fi

      - name: Upload configs.json
        uses: actions/upload-artifact@v4
        with:
          name: generated-config
          path: configs.json

      - name: Upload config.json
        uses: actions/upload-artifact@v4
        with:
          name: additional-config
          path: config.json
